; Explicit unicast RTPS discovery for the ping responder.
[common]
DCPSDefaultDiscovery=network_rtps_discovery
DCPSGlobalTransportConfig=network_rtps

[rtps_discovery/network_rtps_discovery]
ResendPeriod=1
SedpMulticast=0
SpdpLocalAddress=ping-responder:17910
SpdpSendAddrs=ping-requester:17910,ping-responder:17910

[config/network_rtps]
transports=rtps_udp_data

[transport/rtps_udp_data]
transport_type=rtps_udp
use_multicast=0
PortMode=probe
