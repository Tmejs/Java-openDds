; InfoRepo discovers endpoints; TCP carries ping/pong application samples.
; The IOR file is written by the local DCPSInfoRepo process.
[common]
DCPSInfoRepo=file:///tmp/java-opendds-native-repo.ior
DCPSBit=0
DCPSGlobalTransportConfig=native_tcp

[config/native_tcp]
transports=tcp_data

[transport/tcp_data]
transport_type=tcp
local_address=127.0.0.1:0
